<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScalpMaster</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <div class="brand">
        <span class="icon">⚡</span>
        <span class="title">ScalpMaster</span>
      </div>
      <span class="badge">Web Terminal</span>
    </div>

    <!-- 15-Day Equity Curve Section (Requirement 4) -->
    <div class="card chart-card">
      <div class="chart-header">
        <div>
          <div class="card-label">15-DAY NET EQUITY CURVE</div>
          <div class="equity-value" id="pop-equity-val">₹0.00</div>
        </div>
        <div class="equity-stats" id="pop-equity-meta">
          <span id="pop-trade-count">0 trades</span>
        </div>
      </div>
      <div class="canvas-container">
        <canvas id="equity-canvas" width="280" height="130"></canvas>
      </div>
      <div class="chart-dates">
        <span id="chart-start-date">15 days ago</span>
        <span id="chart-end-date">Today</span>
      </div>
    </div>

    <!-- Toggle HUD Button (Requirement 1) -->
    <button id="toggle-hud-btn" class="btn btn-hud-toggle">
      <span id="toggle-hud-icon">👁️</span>
      <span id="toggle-hud-text">Hide Order Window on Chart</span>
    </button>

    <!-- CSV Export Section (Requirement 2) -->
    <div class="card export-card">
      <div class="card-label">EXPORT TRADE LOG (CSV)</div>
      <div class="export-row">
        <select id="csv-range-select" class="select-input">
          <option value="30" selected>Last 30 Days (Default)</option>
          <option value="120">Last 120 Days</option>
          <option value="all">All Trades History</option>
        </select>
        <button id="download-csv-btn" class="btn btn-download">
          <span>📥 Download</span>
        </button>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="action-buttons">
      <button id="open-fyers-btn" class="btn btn-primary">Open FYERS Terminal</button>
      <button id="reset-day-btn" class="btn btn-danger">Reset Today's Stats</button>
    </div>

    <div class="footer">
      <span>Works automatically on <b>trade.fyers.in</b></span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
